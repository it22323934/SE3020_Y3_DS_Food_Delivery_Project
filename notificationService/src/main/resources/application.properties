spring.application.name=notificationService
server.port=8083

# MongoDB configuration
spring.data.mongodb.uri=mongodb://localhost:27017/notification-db

# Kafka Consumer Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=notification-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
# Additional Kafka consumer configurations for order events
spring.kafka.consumer.properties.spring.json.type.mappings=userEvent:com.foodDelivery.notificationService.event.UserRegistrationEvent,orderEvent:com.foodDelivery.notificationService.event.OrderStatusEvent

# Logging
logging.level.com.foodDelivery.notificationService=DEBUG

