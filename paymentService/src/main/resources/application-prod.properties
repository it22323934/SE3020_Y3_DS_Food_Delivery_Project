# Production Configuration for Payment Service
# This file contains production-specific settings for secure error handling

# Security Configuration - Maximum security for production
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.whitelabel.enabled=false

# Disable detailed error pages
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# Logging Configuration for Production
logging.level.root=WARN
logging.level.com.foodDelivery.paymentService=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
logging.level.org.springframework.boot.autoconfigure=WARN
logging.level.com.stripe=WARN

# Disable actuator endpoints that might expose sensitive information
management.endpoints.enabled-by-default=false
management.endpoint.health.enabled=true
management.endpoint.info.enabled=false
management.endpoint.metrics.enabled=false
management.endpoint.env.enabled=false
management.endpoint.configprops.enabled=false
management.endpoint.beans.enabled=false
management.endpoint.mappings.enabled=false

# Security headers
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict

# Disable server information in response headers
server.server-header=

# Stripe configuration for production (use environment variables)
# stripe.secret.key=${STRIPE_SECRET_KEY:}
# stripe.publishable.key=${STRIPE_PUBLISHABLE_KEY:}
