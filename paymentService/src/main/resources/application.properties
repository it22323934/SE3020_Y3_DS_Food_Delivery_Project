spring.application.name=paymentService
spring.datasource.url=jdbc:mysql://localhost:3306/paymentService
spring.datasource.username=root
spring.datasource.password=mysql
spring.jpa.hibernate.ddl-auto=none
server.port=8082

#Swagger
springdoc.swagger-ui.path=/swagger-ui.html

# Stripe
stripe.secret.key=sk_test_51Q96xQ002QexDtLQe2zUMfFfApGxvKcJyng2VTTEe7CsDDYmJ5ChHSLyGKiHJ2R56E0iopMUFHK9AgDE0CSwgG4J00FTuIMmQD
stripe.currency=lkr

# Validation messages
spring.messages.basename=messages

# Security Configuration - Disable detailed error responses in production
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# Logging Configuration
logging.level.com.foodDelivery=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.com.stripe=WARN

# Production-specific error handling
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

#Kafka Properties
spring.kafka.bootstrap-servers=localhost:9094
spring.kafka.template.default-topic=payment-succeed
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer