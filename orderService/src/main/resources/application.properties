spring.application.name=orderService
server.port=7083
restaurant.service.url=http://localhost:8089

foodDelivery.app.jwt.secret=foodDeliverySecretKeyWhichShouldBeVeryLongAndSecureanditneedstoberobustandwellmaintedwithalllfacilitiesandalsoneedtoconsideralsphabranvecenturykfdkaflkd

#Kafka Producer Configuration
spring.kafka.bootstrap-servers=localhost:9032
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.trusted.packages=*

# Security Configuration - Disable detailed error responses in production
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# Logging Configuration
logging.level.org.apache.kafka=INFO
logging.level.com.foodDelivery.orderService=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN

# Production-specific error handling
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false